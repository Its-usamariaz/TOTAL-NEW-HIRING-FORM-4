<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application Form</title>
<style>
  :root{
    --theme:#6875E2;           /* Zoho form theme colour */
    --ink:#25272e;
    --muted:#9aa0b5;
    --line:#c9cede;
    --bg:#eef0f6;
    --req:#e8503a;
    --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg);color:var(--ink);
    padding:28px 12px;line-height:1.45;
  }
  .form-card{
    max-width:900px;margin:0 auto;background:#fff;
    border-radius:10px;box-shadow:0 2px 14px rgba(37,39,46,.07);
  }
  .form-header{padding:56px 64px 44px;border-bottom:1px solid #e3e6ee}
  .form-header img{max-height:120px;display:block;margin-bottom:32px;margin-left:-14px}
  .form-header h1{font-size:27px;font-weight:700}
  .form-body{padding:20px 64px 56px}
  @media(max-width:640px){
    .form-header{padding:32px 22px 26px}
    .form-body{padding:8px 22px 36px}
  }

  .section{padding:30px 0 12px;border-bottom:1px solid #e3e6ee}
  .section:last-of-type{border-bottom:none}
  .sec-head{display:flex;align-items:baseline;gap:22px;margin-bottom:24px}
  .sec-head h2{font-size:19px;font-weight:700}
  .sec-clear{
    background:none;border:none;font-size:16px;font-weight:600;
    color:#c8cdf0;cursor:pointer;font-family:inherit;
  }
  .sec-clear.active{color:var(--theme)}

  .field{margin-bottom:26px}
  .field label.qlabel{display:block;font-weight:600;font-size:16px;margin-bottom:10px}
  .req{color:var(--req);margin-left:3px}

  input[type=text],input[type=email],input[type=tel],input[type=number],
  input[type=date],input[type=time],select{
    width:100%;padding:13px 15px;font-size:15.5px;color:var(--ink);
    border:1px solid var(--line);border-radius:var(--radius);
    background:#fff;font-family:inherit;height:52px;
  }
  select{
    appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%2325272e' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;background-position:right 16px center;
    cursor:pointer;
  }
  select:invalid, select option[value=""]{color:var(--muted)}
  select option{color:var(--ink)}
  input::placeholder{color:var(--muted)}
  input:focus,select:focus{
    outline:none;border-color:var(--theme);
    box-shadow:0 0 0 3px rgba(104,117,226,.18);
  }

  .phone-row{display:grid;grid-template-columns:180px 1fr;gap:14px}
  .datetime-row{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  @media(max-width:560px){
    .phone-row{grid-template-columns:130px 1fr}
    .datetime-row{grid-template-columns:1fr}
  }

  .field.hidden{display:none}

  .consent{
    margin-top:34px;padding:18px 22px;background:#f7f8fb;
    border:1px solid #e3e6ee;border-radius:var(--radius);
    font-size:13.5px;color:#5a6076;line-height:1.6;
  }

  .actions{display:flex;justify-content:flex-end;gap:26px;align-items:center;padding-top:28px}
  .btn-reset{background:none;border:none;color:#b9bfd8;font-size:17px;cursor:pointer;font-family:inherit}
  .btn-reset:hover{color:var(--theme)}
  .btn-submit{
    background:var(--theme);color:#fff;border:none;font-size:17px;font-weight:600;
    padding:14px 38px;border-radius:999px;cursor:pointer;font-family:inherit;
  }
  .btn-submit:hover{filter:brightness(1.06)}
  .btn-submit:disabled{opacity:.55;cursor:not-allowed}

  .error-msg{color:var(--req);font-size:13px;margin-top:6px;display:none}
  .field.invalid .error-msg{display:block}
  .field.invalid input,.field.invalid select{border-color:var(--req)}

  .success{text-align:center;padding:80px 40px;display:none}
  .success .tick{
    width:66px;height:66px;border-radius:50%;background:var(--theme);
    color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;
    margin:0 auto 22px;
  }
  .success h2{font-size:23px;margin-bottom:8px}
  .success p{color:var(--muted)}
</style>
</head>
<body>

<div class="form-card">
  <div class="form-header">
    <img id="logo" src="" alt="Total Wireless" style="display:none">
    <h1 id="formTitle"></h1>
  </div>
  <form class="form-body" id="appForm" novalidate autocomplete="off"></form>
  <div class="success" id="successBox">
    <div class="tick">&#10003;</div>
    <h2>Application submitted</h2>
    <p>Thank you. We'll review your application and be in touch.</p>
  </div>
</div>

document.documentElement.style.setProperty('--theme', CONFIG.themeColor);
document.getElementById('formTitle').textContent = CONFIG.formTitle;
if (CONFIG.logoUrl){
  const l=document.getElementById('logo');
  l.src=CONFIG.logoUrl; l.style.display='block';
  l.onerror=()=>l.style.display='none';
}

const form = document.getElementById('appForm');

function fieldHtml(f){
  const req = f.required ? '<span class="req">*</span>' : '';
  let control='';
  switch(f.type){
    case 'dropdown':
      control = `<select id="${f.id}" name="${f.id}" required>
        <option value="" selected>-None-</option>
        ${f.options.map(o=>`<option value="${o}">${o}</option>`).join('')}
      </select>`; break;
    case 'phone':
      control = `<div class="phone-row">
        <select id="${f.id}_cc">
          ${CONFIG.countryCodes.map(c=>`<option value="${c.code.trim()}" ${c.code===CONFIG.defaultCountry?'selected':''}>${c.flag} (${c.code.trim()})</option>`).join('')}
        </select>
        <input type="tel" id="${f.id}" name="${f.id}">
      </div>`; break;
    case 'datetime':
      control = `<div class="datetime-row">
        <input type="text" id="${f.id}_date" placeholder="MM/DD/YYYY"
               onfocus="this.type='date'" onblur="if(!this.value)this.type='text'">
        <input type="time" id="${f.id}_time" value="${CONFIG.defaultInterviewTime}">
      </div>`; break;
    default:
      control = `<input type="${f.type}" id="${f.id}" name="${f.id}"
        ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''}>`;
  }
  return `<div class="field ${f.showIf?'hidden':''}" data-id="${f.id}">
    <label class="qlabel">${f.label}${req}</label>
    ${control}
    <div class="error-msg" id="${f.id}_err">This field is required.</div>
  </div>`;
}

form.innerHTML = CONFIG.sections.map((s,si)=>`
  <div class="section" data-sec="${si}">
    <div class="sec-head">
      <h2>${s.title}</h2>
      ${s.hideClear?'':`<button type="button" class="sec-clear" data-sec="${si}">Clear</button>`}
    </div>
    ${s.fields.map(fieldHtml).join('')}
  </div>`).join('')
  + `<div class="consent">
      By submitting this form, you agree to be contacted by Total Wireless&nbsp;&ndash; Authorized Retailer by phone, text message, or email regarding your job application. Message and data rates may apply. You can opt out at any time by replying STOP.
    </div>
    <div class="actions">
      <button type="button" class="btn-reset" id="resetBtn">Reset</button>
      <button type="submit" class="btn-submit" id="submitBtn">Submit</button>
    </div>`;

const allFields = CONFIG.sections.flatMap(s=>s.fields);

/* ---------- branching (follow-up questions) ---------- */
function isVisible(f){
  return !document.querySelector(`.field[data-id="${f.id}"]`).classList.contains('hidden');
}
function applyBranching(){
  allFields.filter(f=>f.showIf).forEach(f=>{
    const parent = allFields.find(p=>p.id===f.showIf.field);
    const show = f.showIf.equals.includes(getValue(parent));
    const el = document.querySelector(`.field[data-id="${f.id}"]`);
    el.classList.toggle('hidden', !show);
    if(!show){ // clear hidden answers so stale data never submits
      el.classList.remove('invalid');
      el.querySelectorAll('input,select').forEach(i=>{
        if(i.tagName==='SELECT') i.selectedIndex=0; else i.value='';
      });
    }
  });
}
form.addEventListener('input',applyBranching);
form.addEventListener('change',applyBranching);

/* ---------- helpers ---------- */
function getValue(f){
  if(f.type==='phone'){
    const num=document.getElementById(f.id).value.trim();
    return num ? document.getElementById(f.id+'_cc').value+' '+num : '';
  }
  if(f.type==='datetime'){
    const d=document.getElementById(f.id+'_date').value;
    const t=document.getElementById(f.id+'_time').value;
    if(!d) return '';
    const [y,m,dd]=d.split('-');
    let [hh,mm]=t.split(':').map(Number);
    const ampm = hh>=12 ? 'PM' : 'AM';
    hh = hh%12 || 12;
    return `${m}/${dd}/${y} ${hh}:${String(mm).padStart(2,'0')} ${ampm}`;
  }
  if(f.type==='file'){
    const el=document.getElementById(f.id);
    return el.files[0]?el.files[0].name:'';
  }
  return document.getElementById(f.id)?.value.trim() ?? '';
}

function clearSection(si){
  CONFIG.sections[si].fields.forEach(f=>{
    ['','_cc','_date','_time'].forEach(sfx=>{
      const el=document.getElementById(f.id+sfx);
      if(!el) return;
      if(el.tagName==='SELECT'){ el.selectedIndex = sfx==='_cc' ? el.selectedIndex : 0; }
      else if(el.type==='file'){ el.value=''; const n=document.getElementById(f.id+'_name'); if(n)n.textContent=''; }
      else if(el.type==='time'){ el.value=CONFIG.defaultInterviewTime; }
      else { el.value=''; if(el.id.endsWith('_date')) el.type='text'; }
    });
    document.querySelector(`.field[data-id="${f.id}"]`)?.classList.remove('invalid');
  });
}

document.querySelectorAll('.sec-clear').forEach(btn=>{
  btn.addEventListener('click',()=>clearSection(+btn.dataset.sec));
});

/* section Clear links light up when the section has data (matches Zoho) */
function refreshClearStates(){
  document.querySelectorAll('.sec-clear').forEach(btn=>{
    const has = CONFIG.sections[+btn.dataset.sec].fields.some(f=>getValue(f));
    btn.classList.toggle('active',has);
  });
}
form.addEventListener('input',refreshClearStates);
form.addEventListener('change',refreshClearStates);

document.getElementById('resetBtn').addEventListener('click',()=>{
  CONFIG.sections.forEach((s,si)=>clearSection(si));
  applyBranching(); refreshClearStates();
});

/* ---------- validate + submit ---------- */
form.addEventListener('submit', async e=>{
  e.preventDefault();
  let firstBad=null;
  allFields.forEach(f=>{
    const el=document.querySelector(`.field[data-id="${f.id}"]`);
    let bad = f.required && isVisible(f) && !getValue(f);
    const err=document.getElementById(f.id+'_err');
    err.textContent='This field is required.';
    if(f.type==='email' && !bad && getValue(f) && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(getValue(f))){
      bad=true; err.textContent='Please enter a valid email address.';
    }
    el.classList.toggle('invalid',bad);
    if(bad && !firstBad) firstBad=el;
  });
  if(firstBad){ firstBad.scrollIntoView({behavior:'smooth',block:'center'}); return; }

  const payload={ submitted_at:new Date().toLocaleDateString('en-US') };
  allFields.forEach(f=>{ payload[f.id]= isVisible(f) ? getValue(f) : ''; });

  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='Submitting…';
  try{
    if(CONFIG.submitUrl){
      await submitUrl(CONFIG.submitUrl,{
        method:'POST',
        mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(payload)
      });
    }else{
      console.log('No submitUrl set. Payload:',payload);
    }
    document.querySelector('.form-body').style.display='none';
    document.getElementById('successBox').style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){
    btn.disabled=false; btn.textContent='Submit';
    alert('Submission failed. Please check your connection and try again.');
  }
});

applyBranching();
</script>
